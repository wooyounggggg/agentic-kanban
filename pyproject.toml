[project]
name = "wt-board"
version = "0.1.0"
description = "TUI Kanban Board for Git worktree-based parallel development with AI agents"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.80.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "watchdog>=4.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "textual-dev>=1.0",
]

[project.scripts]
wt-board = "wt_board.cli.main:cli"
wtb = "wt_board.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wt_board"]
